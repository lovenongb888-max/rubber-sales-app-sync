<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#087A55" />
    <title>Rubber ใช้งานออฟไลน์</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f8fcfa; color: #12372a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { max-width: 360px; text-align: center; }
      .mark { width: 68px; height: 68px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 22px; background: #e8fbf2; color: #087a55; font-size: 32px; font-weight: 800; }
      h1 { margin: 0; font-size: 24px; line-height: 1.3; }
      p { margin: 10px 0 0; color: #678076; font-size: 15px; line-height: 1.55; }
      button { margin-top: 22px; min-height: 48px; padding: 0 20px; border: 0; border-radius: 15px; background: #087a55; color: #fff; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">R</div>
      <h1>ยังไม่ได้เชื่อมต่ออินเทอร์เน็ต</h1>
      <p>กรุณาเชื่อมต่อเครือข่าย แล้วลองเปิด Rubber อีกครั้ง</p>
      <button type="button" onclick="location.reload()">ลองใหม่</button>
    </main>
  </body>
</html>
